[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for EVA and public RNA foundation models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "huggingface_hub>=0.24,<1",
  "metaflow>=2.12,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
scgpt = ["scgpt>=0.2.1,<0.3"]
tensorboard = ["tensorboard>=2.16,<3"]
test = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN401"]
